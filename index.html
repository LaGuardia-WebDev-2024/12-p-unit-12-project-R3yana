<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <button id="mem1-button">Memory #1</button>
    <button id="mem2-button">Memory #2</button>
    <button id="mem3-button">Memory #3</button>
    <h1>My Top 3 Memories of <span>This Year</span></h1>
    <ol>
      <li>
        <h3 id="mem1">Memory #1</h3>
        <p>piano recitle.</p>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcBaX8mUOq4SfSPwLd9ZOd7Zub-fXPdbFrbw&s" id="Piano" style="display:  none">

      <li>

         <img src= "https://www.hockerlawfirm.com/wp-content/uploads/real-estate-lawyer.jpeg" id="law" style="display:none">
      </li>

      <li>
        <h3 id="mem3">Memory #3</h3>
        <p>My birthday</p>
        <img src =" https://m.media-amazon.com/images/I/81DXhu6ONML._AC_UF894,1000_QL80_.jpg" id="birth" style="display:none">

    <script>
      $("h1").text(" MY THREE TOP MEMEORIES LOL!!!");
      
 $("p").css("color", "blue ")
     
      
      $("#mem1-button").click(function () {

      });

      
      $("#mem2-button").click(function () {
        $("#mem2").css("color", "blue");
        $("#law").show(3000)
      
 });

      
      $("#mem3-button").click(function () {
        $("#mem3").css("color", "green");
        $("#birth").show(3000)
      });
    </script>
